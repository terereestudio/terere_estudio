<div class="podcast" data-podcast>
  <audio preload="none" src="{{raiz}}audio/podcast-nos-van-a-reemplazar.mp3"></audio>
  <p class="podcast-titulo">Escuchá esta nota en formato podcast</p>
  <div class="podcast-controles">
    <button type="button" class="podcast-play" aria-label="Reproducir">
      <svg class="icono icono-play" fill="currentColor" aria-hidden="true"><use href="{{raiz}}img/iconos.svg#play"/></svg>
      <svg class="icono icono-pausa" fill="currentColor" aria-hidden="true"><use href="{{raiz}}img/iconos.svg#pausa"/></svg>
    </button>
    <button type="button" class="podcast-saltar" data-saltar="-10" aria-label="Retroceder 10 segundos"><svg class="icono" fill="currentColor" aria-hidden="true"><use href="{{raiz}}img/iconos.svg#atras"/></svg></button>
    <button type="button" class="podcast-saltar" data-saltar="10" aria-label="Adelantar 10 segundos"><svg class="icono" fill="currentColor" aria-hidden="true"><use href="{{raiz}}img/iconos.svg#adelante"/></svg></button>
    <input class="podcast-barra" type="range" min="0" max="100" step="0.1" value="0" aria-label="Posición del audio">
    <span class="podcast-tiempo"><span data-actual>0:00</span> / <span data-total>26:13</span></span>
  </div>
</div>
